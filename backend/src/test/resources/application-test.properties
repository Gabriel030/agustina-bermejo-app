# Perfil "test": se combina con src/main/resources/application.properties (no lo reemplaza,
# a diferencia de un application.properties suelto en test/resources con el mismo nombre —
# ese sí pisa por completo al de main en el classpath). Solo pisa jwt.secret, que en main
# depende de una env var que no existe en CI/local. No usar este valor fuera de tests.
jwt.secret=test-secret-not-for-production-use-only-in-tests

# Spec Gestión de personas: los tests no deben escribir dentro del repo (backend/data/),
# van al temp dir del sistema — igual queda gitignoreado, pero así no ensucia el working dir.
app.uploads.directory=${java.io.tmpdir}/agustina-bermejo-app-test-uploads

# El bucket de rate limiting es en memoria y compartido por todo el proceso (Bucket4j,
# ver SecurityConfig/LoginRateLimiter) — con la capacidad de producción (20/min para
# /auth/register), toda la suite completa (Karate + tests MockMvc) lo agota entre sí
# mismos al compartir un único ApplicationContext cacheado, y un test que en verdad
# prueba otra cosa (ej. KarateSuiteTest "institutionId inexistente — 404") termina
# recibiendo 429 en vez del status que le corresponde. Subir la capacidad acá no
# invalida RateLimitingTest, que fija su propia capacidad baja vía @TestPropertySource
# (eso le da un ApplicationContext propio, cacheado aparte del resto de la suite).
auth.rate-limit.login.capacity=200
auth.rate-limit.login.refill-per-minute=200
auth.rate-limit.forgot-password.capacity=200
auth.rate-limit.forgot-password.refill-per-minute=200
auth.rate-limit.register.capacity=200
auth.rate-limit.register.refill-per-minute=200

spring.flyway.locations=classpath:db/migration,classpath:db/testmigration

app.event-publication.resubmission.enabled=false

spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
