# Perfil "test": se combina con src/main/resources/application.properties (no lo reemplaza,
# a diferencia de un application.properties suelto en test/resources con el mismo nombre —
# ese sí pisa por completo al de main en el classpath). Solo pisa jwt.secret, que en main
# depende de una env var que no existe en CI/local. No usar este valor fuera de tests.
jwt.secret=test-secret-not-for-production-use-only-in-tests

# Spec Gestión de personas: los tests no deben escribir dentro del repo (backend/data/),
# van al temp dir del sistema — igual queda gitignoreado, pero así no ensucia el working dir.
app.uploads.directory=${java.io.tmpdir}/agustina-bermejo-app-test-uploads
