spring.application.name=backend

# Defaults apuntan al Postgres de docker-compose.yml (raiz del repo) — mvn spring-boot:run
# funciona sin config extra en local. Overrideable por variable de entorno en otros ambientes.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agustina_bermejo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# Sin default a proposito: si JWT_SECRET no esta seteada, el boot falla explicitamente
# en vez de arrancar con un secret debil. Ver "Spec - JWT y login" (pregunta abierta 1).
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-minutes=15
jwt.refresh-token-expiration-days=7

# Código de recuperación de 6 dígitos (no un link) — ventana corta a propósito, se
# tipea al toque, no se deja abierto un rato como pasaba con el link.
auth.password-reset-code-expiration-minutes=15
auth.password-reset-code-max-attempts=5
# Token de intercambio (separa "verificaste el código" de "ya elegiste contraseña") —
# vida corta a propósito, la pantalla de contraseña nueva se usa al toque, no se deja abierta.
auth.password-reset-exchange-token-expiration-minutes=5

# A diferencia de JWT_SECRET, con default vacio: JWT es indispensable para todo el resto de la
# app (cualquier request autenticado), Google OAuth es opcional (2 endpoints nuevos nomas) — no
# tiene sentido que arrancar el backend en local para cualquier otra cosa dependa de tener un
# Client ID de Google Cloud configurado. Sin valor real, GoogleIdTokenService simplemente
# rechaza cualquier idToken (aud nunca va a matchear "").
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}

auth.lockout.max-attempts=5
auth.lockout.duration-minutes=15

# RF-AUTH-05: política mínima de contraseña, configurable y no hardcodeada.
auth.password.min-length=8
auth.password.require-letter-and-digit=true
auth.password.require-uppercase=true

# Rate limiting en memoria (Bucket4j) sobre los dos endpoints públicos más sensibles a
# abuso: fuerza bruta de login y spam de emails de recuperación. Capacidades por encima
# de lo que ya pega la suite de tests existente (ver AuthControllerTest) para no romperla.
auth.rate-limit.login.capacity=10
auth.rate-limit.login.refill-per-minute=10
auth.rate-limit.forgot-password.capacity=5
auth.rate-limit.forgot-password.refill-per-minute=5
# Registro público (Épica 7) — mismo criterio que login/forgot-password. Capacidad
# por encima de lo que pega la suite de tests existente (RegistrationFlowTest hace
# 7 registros en su propio proceso) para no romperla, mismo motivo que las otras dos.
auth.rate-limit.register.capacity=20
auth.rate-limit.register.refill-per-minute=20

# Sin default real a proposito (BREVO_SMTP_USERNAME/BREVO_SMTP_KEY): a diferencia de
# google.oauth.client-id, Spring Mail no valida la conexion al bootear, asi que dev local
# sin Brevo configurado sigue arrancando bien — solo falla el envio puntual si se llega a
# pedir un reset sin credenciales reales.
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from-address=${MAIL_FROM_ADDRESS:no-reply@example.com}

# Hoy no hay frontend desplegado — default al puerto de Vite (frontend/package.json).
# Override por variable de entorno el día que haya un dominio real.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Spec Gestión de personas. Sin Docker de por medio (docker-compose.yml solo tiene
# Postgres, la app corre directo en el host) — filesystem local configurable.
app.uploads.directory=${UPLOADS_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
