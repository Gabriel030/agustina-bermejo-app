spring.application.name=backend

# Zona horaria explícita: sin esto, LocalDateTime.now(), los cron de @Scheduled y los
# timestamps del log toman la zona del host, así que el mismo código da resultados
# distintos en una máquina local (UTC-3) y en un container (UTC). Se usa un nombre IANA
# y no un offset fijo para que siga siendo correcto si vuelve el horario de verano.
# Se aplica en BackendApplication.main() ANTES de arrancar Spring, porque Logback y el
# scheduler se inicializan antes que cualquier @PostConstruct. Esta propiedad es la que
# consumen Jackson y el zone= de los @Scheduled; TimeZoneConfig falla el arranque si no
# coincide con lo que se aplicó a la JVM.
app.timezone=${APP_TIMEZONE:America/Argentina/Buenos_Aires}
spring.jackson.time-zone=${app.timezone}

# Defaults apuntan al Postgres de docker-compose.yml (raiz del repo) — mvn spring-boot:run
# funciona sin config extra en local. Overrideable por variable de entorno en otros ambientes.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agustina_bermejo}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# Sin default a proposito: si JWT_SECRET no esta seteada, el boot falla explicitamente
# en vez de arrancar con un secret debil. Ver "Spec - JWT y login" (pregunta abierta 1).
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-minutes=15
jwt.refresh-token-expiration-days=7

# Código de recuperación de 6 dígitos (no un link) — ventana corta a propósito, se
# tipea al toque, no se deja abierto un rato como pasaba con el link.
auth.password-reset-code-expiration-minutes=15
auth.password-reset-code-max-attempts=5
# Token de intercambio (separa "verificaste el código" de "ya elegiste contraseña") —
# vida corta a propósito, la pantalla de contraseña nueva se usa al toque, no se deja abierta.
auth.password-reset-exchange-token-expiration-minutes=5

# A diferencia de JWT_SECRET, con default vacio: JWT es indispensable para todo el resto de la
# app (cualquier request autenticado), Google OAuth es opcional (2 endpoints nuevos nomas) — no
# tiene sentido que arrancar el backend en local para cualquier otra cosa dependa de tener un
# Client ID de Google Cloud configurado. Sin valor real, GoogleIdTokenService simplemente
# rechaza cualquier idToken (aud nunca va a matchear "").
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}

auth.lockout.max-attempts=5
auth.lockout.duration-minutes=15

# RF-AUTH-05: política mínima de contraseña, configurable y no hardcodeada.
auth.password.min-length=8
auth.password.require-letter-and-digit=true
auth.password.require-uppercase=true

# Rate limiting en memoria (Bucket4j) sobre los dos endpoints públicos más sensibles a
# abuso: fuerza bruta de login y spam de emails de recuperación. Capacidades por encima
# de lo que ya pega la suite de tests existente (ver AuthControllerTest) para no romperla.
auth.rate-limit.login.capacity=10
auth.rate-limit.login.refill-per-minute=10
auth.rate-limit.forgot-password.capacity=5
auth.rate-limit.forgot-password.refill-per-minute=5
# Registro público (Épica 7) — mismo criterio que login/forgot-password. Capacidad
# por encima de lo que pega la suite de tests existente (RegistrationFlowTest hace
# 7 registros en su propio proceso) para no romperla, mismo motivo que las otras dos.
auth.rate-limit.register.capacity=20
auth.rate-limit.register.refill-per-minute=20

# Sin default real a proposito (BREVO_SMTP_USERNAME/BREVO_SMTP_KEY): a diferencia de
# google.oauth.client-id, Spring Mail no valida la conexion al bootear, asi que dev local
# sin Brevo configurado sigue arrancando bien — solo falla el envio puntual si se llega a
# pedir un reset sin credenciales reales.
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_KEY:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from-address=${MAIL_FROM_ADDRESS:no-reply@example.com}

# Hoy no hay frontend desplegado — default al puerto de Vite (frontend/package.json).
# Override por variable de entorno el día que haya un dominio real.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Spec Gestión de personas. Sin Docker de por medio (docker-compose.yml solo tiene
# Postgres, la app corre directo en el host) — filesystem local configurable.
app.uploads.directory=${UPLOADS_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}

# Épica 17 Fase 1 — Observabilidad. El starter de actuator ya estaba en el pom
# pero sin registry: Micrometer medía en memoria y los valores morían con la JVM.
# Se expone solo lo necesario para scrapear; el resto de los endpoints de actuator
# (env, beans, heapdump, loggers) queda fuera a propósito.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# show-details=never, no when_authorized: el health queda público para poder
# engancharle un chequeo externo, y el detalle expone versión de Postgres,
# estado de Flyway y paths del filesystem.
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Dos tags comunes a todas las series, para que un mismo Grafana distinga
# entornos sin montar dos stacks. Mismo criterio de default que el resto del archivo.
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.env=${APP_ENV:local}

# Explícito aunque sea el default: activarlo en http.server.requests genera ~65
# buckets por combinación uri/status y multiplica la cardinalidad por veinte
# (~2.500 series pasarían a ~53.000, arriba del free tier de Grafana Cloud).
management.metrics.distribution.percentiles-histogram.all=false
# El _max de un timer es un máximo sobre ventana deslizante, no histórico: si el
# scrape interval llega a superar este expiry, la ventana vence entre scrape y
# scrape y el _max devuelve valores decaídos. Subir el scrape obliga a subir esto.
management.metrics.distribution.expiry.all=2m

# Credencial dedicada para el scraping de /actuator/prometheus, aislada del modelo
# de identidad de la app: los roles viven en la tabla role, así que usar uno
# implicaría un usuario de servicio en la base y que el agente renueve un JWT cada
# 15 minutos. Sin estas variables seteadas no existe ningún usuario y el endpoint
# queda inaccesible, que es el default seguro.
management.security.user=${ACTUATOR_USER:}
management.security.password=${ACTUATOR_PASSWORD:}
# El indicador de mail se excluye del health: verificado que lo pone en DOWN y hace
# que /actuator/health responda 503 cuando el SMTP no está configurado o no responde,
# con la API sirviendo perfecto. Como este endpoint existe para que un chequeo externo
# sepa si la app está viva, incluirlo convierte cada hipo de Brevo en una falsa alarma.
management.health.mail.enabled=false
