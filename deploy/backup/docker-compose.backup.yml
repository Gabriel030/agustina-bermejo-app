services:
  backup:
    build:
      context: ./
    image: agustina-bermejo/backup:local
    command: ["cron"]
    restart: unless-stopped
    environment:
      PGHOST: ${BACKUP_PGHOST:-postgres}
      PGPORT: ${BACKUP_PGPORT:-5432}
      PGUSER: ${POSTGRES_USER:-agustina}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
      PGDATABASE: ${POSTGRES_DB:-agustina_bermejo}
      TZ: ${BACKUP_TZ:-America/Argentina/Buenos_Aires}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 */6 * * *}
      BACKUP_FRESHNESS_SCHEDULE: ${BACKUP_FRESHNESS_SCHEDULE:-30 9 * * *}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-13}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-false}
      BACKUP_KEEP_RECENT: ${BACKUP_KEEP_RECENT:-4}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-agustina-bermejo}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      ALERT_LABEL: ${ALERT_LABEL:-agustina-bermejo}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
    networks:
      - internal
      - default
    volumes:
      - ${BACKUP_DIR:-backup_data}:/backups
      - backup_metrics:/metrics
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond > /dev/null && pg_isready -q -h \"$$PGHOST\" -p \"$$PGPORT\" -U \"$$PGUSER\""]
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  internal:
    internal: true

volumes:
  backup_data:
  backup_metrics:
