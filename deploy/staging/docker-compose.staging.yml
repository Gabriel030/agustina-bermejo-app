name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME es obligatoria en staging y distinta de la de producción}

services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: ${STAGING_SPRING_PROFILES:-prod}
      DEMO_SEED_ENABLED: ${STAGING_DEMO_SEED:-false}
      APP_AUTH_REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/auth}
      APP_AUTH_REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      PLATFORM_PROVISIONING_INITIAL_BILLING_MODE: ${STAGING_BILLING_MODE:-OFF}
