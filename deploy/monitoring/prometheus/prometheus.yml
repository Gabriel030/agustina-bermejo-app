global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    basic_auth:
      username_file: /tmp/actuator_user
      password_file: /tmp/actuator_password
    static_configs:
      - targets: ["BACKEND_METRICS_TARGET_PLACEHOLDER"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
