name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['*.md', 'docs/**']
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['*.md', 'docs/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: changes
        shell: bash
        run: |
          set -uo pipefail
          relevant=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" 2>/dev/null); then
              if ! printf '%s\n' "$changed" | grep -qE '^(backend/|\.github/workflows/)'; then
                relevant=false
              fi
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "backend changes: $relevant"

      - name: Set up JDK 21
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend test suite
        if: steps.changes.outputs.relevant == 'true'
        working-directory: backend
        run: ./mvnw clean verify

  local-tests-log:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the local test log when the billing domain changes
        shell: bash
        run: |
          set -uo pipefail
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          if printf '%s\n' "$changed" | grep -qE '^backend/(pom\.xml|src/main/java/com/red_escuela/backend/(shared/domain|billing/(operation|configuration/(policy|domain)|authorization/domain|invoice/(domain|policy|operation)|account/(domain|policy)|planning/(policy|domain|service)))/)'; then
            if ! printf '%s\n' "$changed" | grep -qx 'docs/testing/local-test-log.md'; then
              echo "This PR changes code that PIT mutates (targetClasses of the mutation profile): add its local PIT run to docs/testing/local-test-log.md"
              exit 1
            fi
          fi
          echo "local test log check passed"

  frontend:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend changes
        id: changes
        shell: bash
        run: |
          set -uo pipefail
          relevant=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" 2>/dev/null); then
              if ! printf '%s\n' "$changed" | grep -qE '^(frontend/|\.github/workflows/)'; then
                relevant=false
              fi
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "frontend changes: $relevant"

      - name: Set up Node
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.relevant == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build
        if: steps.changes.outputs.relevant == 'true'
        working-directory: frontend
        run: npm run build

      - name: Run frontend test suite
        if: steps.changes.outputs.relevant == 'true'
        working-directory: frontend
        run: npm run test

  # Nota: qa/bruno/ es la colección de exploración MANUAL (GUI/CLI local, contra
  # docker-compose.qa.yml — Postgres descartable, ver ese archivo). No corre en CI a
  # propósito: correrla acá además de Karate sería pagar el mismo costo dos veces
  # (levantar el backend real completo) por la misma cobertura. La regresión
  # automática de contrato HTTP vive en Karate, dentro del job `backend` de arriba
  # (KarateSuiteTest, @SpringBootTest RANDOM_PORT + el mismo Testcontainers que ya
  # usa el resto de la suite) — ver docs/context/testing.md.
