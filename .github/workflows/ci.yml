name: CI

on:
  push:
    branches: [develop, master]
    paths-ignore: ['*.md', 'docs/**']
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['*.md', 'docs/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: changes
        shell: bash
        run: |
          set -uo pipefail
          relevant=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" 2>/dev/null); then
              if ! printf '%s\n' "$changed" | grep -qE '^(backend/|\.github/workflows/)'; then
                relevant=false
              fi
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "backend changes: $relevant"

  backend-build:
    runs-on: ubuntu-latest
    needs: backend-changes
    if: needs.backend-changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21

      - name: Cache the Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Compile main and test sources
        working-directory: backend
        run: ./mvnw -B -DskipTests test-compile

      - name: Upload compiled classes
        uses: actions/upload-artifact@v4
        with:
          name: backend-target
          path: backend/target
          retention-days: 1

  backend-tests:
    runs-on: ubuntu-latest
    needs: backend-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: billing-service-and-note
            selection: 'com/red_escuela/backend/billing/service/**/*,com/red_escuela/backend/billing/note/**/*'
          - shard: billing-rest
            selection: 'com/red_escuela/backend/billing/**/*,!com/red_escuela/backend/billing/service/**/*,!com/red_escuela/backend/billing/note/**/*'
          - shard: everything-else
            selection: '!com/red_escuela/backend/billing/**/*'
    name: backend-tests (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21

      - name: Restore the Maven repository
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Download compiled classes
        uses: actions/download-artifact@v4
        with:
          name: backend-target
          path: backend/target

      - name: Run the shard
        working-directory: backend
        env:
          EXCLUDED_GROUPS: ${{ github.event_name == 'push' && 'none' || 'docs' }}
        run: ./mvnw -B surefire:test "-Dtest=${{ matrix.selection }}" -Dsurefire.failIfNoSpecifiedTests=false "-Dtest.excludedGroups=$EXCLUDED_GROUPS"

  backend:
    runs-on: ubuntu-latest
    needs: [backend-changes, backend-build, backend-tests]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Aggregate the backend results
        shell: bash
        run: |
          set -uo pipefail
          echo "changes=${{ needs.backend-changes.result }} build=${{ needs.backend-build.result }} tests=${{ needs.backend-tests.result }}"
          if [ "${{ needs.backend-changes.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.backend-changes.outputs.relevant }}" != "true" ]; then
            echo "no backend changes"
            exit 0
          fi
          [ "${{ needs.backend-build.result }}" = "success" ] && [ "${{ needs.backend-tests.result }}" = "success" ]

  local-tests-log:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the local test log when the billing domain changes
        shell: bash
        run: |
          set -uo pipefail
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          if printf '%s\n' "$changed" | grep -qE '^backend/(pom\.xml|src/main/java/com/red_escuela/backend/(shared/domain|billing/(operation|reporting/domain|configuration/(policy|domain)|authorization/domain|invoice/(domain|policy|operation)|account/(domain|policy)|note/(domain|policy)|planning/(policy|domain|service)|collections/(policy|domain)|pricing/(domain|policy)|payment/(domain|policy|gateway)))/|src/main/java/com/red_escuela/backend/billing/infrastructure/(MpWebhookSignatureVerifier|SdkMercadoPagoPaymentFetcher)\.java)'; then
            if ! printf '%s\n' "$changed" | grep -qx 'docs/testing/local-test-log.md'; then
              echo "This PR changes code that PIT mutates (targetClasses of the mutation profile): add its local PIT run to docs/testing/local-test-log.md"
              exit 1
            fi
          fi
          echo "local test log check passed"

  frontend:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect frontend changes
        id: changes
        shell: bash
        run: |
          set -uo pipefail
          relevant=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" 2>/dev/null); then
              if ! printf '%s\n' "$changed" | grep -qE '^(frontend/|\.github/workflows/)'; then
                relevant=false
              fi
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "frontend changes: $relevant"

      - name: Set up Node
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.relevant == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Build
        if: steps.changes.outputs.relevant == 'true'
        working-directory: frontend
        run: npm run build

      - name: Run frontend test suite
        if: steps.changes.outputs.relevant == 'true'
        working-directory: frontend
        run: npm run test

  # Nota: qa/bruno/ es la colección de exploración MANUAL (GUI/CLI local, contra
  # docker-compose.qa.yml — Postgres descartable, ver ese archivo). No corre en CI a
  # propósito: correrla acá además de Karate sería pagar el mismo costo dos veces
  # (levantar el backend real completo) por la misma cobertura. La regresión
  # automática de contrato HTTP vive en Karate, dentro del job `backend` de arriba
  # (KarateSuiteTest, @SpringBootTest RANDOM_PORT + el mismo Testcontainers que ya
  # usa el resto de la suite) — ver docs/context/testing.md.
