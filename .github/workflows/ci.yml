name: CI

on:
  push:
    branches: [develop, master]
    paths-ignore: ['*.md', 'docs/**']
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['*.md', 'docs/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      actions: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
      mutation: ${{ steps.changes.outputs.mutation }}
      frontend: ${{ steps.changes.outputs.frontend }}
      lockfile: ${{ steps.changes.outputs.lockfile }}
      reuse_backend: ${{ steps.changes.outputs.reuse_backend }}
      reuse_mutation: ${{ steps.changes.outputs.reuse_mutation }}
      reuse_frontend: ${{ steps.changes.outputs.reuse_frontend }}
      reuse_run: ${{ steps.changes.outputs.reuse_run }}
      reuse_pr: ${{ steps.changes.outputs.reuse_pr }}
      baseline_run: ${{ steps.baseline.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect what changed and whether a green pull request already verified this tree
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.number }}
          TESTED_TREE_DIR: ${{ runner.temp }}/tested-tree-out
        run: bash .github/scripts/detect-changes.sh

      - name: Record the verified tree of this pull request
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tested-tree
          path: ${{ runner.temp }}/tested-tree-out/tested-tree.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Resolve the latest integration-branch run that published test timings
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          run_id=""
          for candidate in $(gh run list --repo "${{ github.repository }}" --workflow ci.yml --branch develop --event push --status success --limit 30 --json databaseId --jq '.[].databaseId' 2>/dev/null); do
            if gh api "repos/${{ github.repository }}/actions/runs/$candidate/artifacts" --jq '.artifacts[] | select(.name == "test-baseline" and .expired == false) | .id' 2>/dev/null | grep -q .; then
              run_id="$candidate"
              break
            fi
          done
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "baseline run: ${run_id:-none (the versioned timings.txt is used)}"

  backend-contract:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Check the OpenAPI contract for breaking changes
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'contract-break-approved') }}
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin "${{ github.base_ref }}"
          if ! git show "origin/${{ github.base_ref }}:contracts/openapi.json" > "$RUNNER_TEMP/openapi-base.json" 2>/dev/null; then
            echo "The base branch has no contracts/openapi.json yet: skipping the breaking-change check"
            exit 0
          fi
          scripts/oasdiff-breaking.sh "$RUNNER_TEMP/openapi-base.json" contracts/openapi.json

  backend-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.reuse_backend != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    name: backend-tests (${{ matrix.shard }})
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Mark the shard start
        run: echo "SHARD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Pull the Postgres image in the background
        run: nohup docker pull -q postgres:16-alpine > "$RUNNER_TEMP/prepull.log" 2>&1 &

      - name: Use the averaged timings of the integration branch when available
        if: needs.changes.outputs.baseline_run != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ needs.changes.outputs.baseline_run }}" --repo "${{ github.repository }}" -n test-baseline -D "$RUNNER_TEMP/baseline"
          python3 .github/scripts/test-shards.py use "$RUNNER_TEMP/baseline"

      - name: Verify the shard assignment covers every test class once
        run: python3 .github/scripts/test-shards.py verify 6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21

      - name: Restore the Maven repository
        id: maven-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Compile and run the shard
        working-directory: backend
        env:
          EXCLUDED_GROUPS: ${{ github.event_name == 'push' && 'none' || 'docs' }}
        run: ./mvnw -B test "-Dtest=$(python3 ../.github/scripts/test-shards.py select ${{ matrix.shard }} 6)" -Dsurefire.failIfNoSpecifiedTests=false -Darchunit.freeze.store.default.allowStoreUpdate=false "-Dtest.excludedGroups=$EXCLUDED_GROUPS"

      - name: Save the Maven repository
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/develop' && matrix.shard == 0 && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}

      - name: Enforce the time budget of the shard
        if: always()
        env:
          SHARD_LIMIT: ${{ github.event_name == 'push' && 'warn' || 'error' }}
        run: |
          export SHARD_END=$(date +%s)
          mkdir -p shard-out
          python3 .github/scripts/test-budget.py check-shard --shard ${{ matrix.shard }} --reports backend/target/surefire-reports --meta-out shard-out/meta.json --shard-limit "$SHARD_LIMIT"

      - name: Collect the shard reports
        if: always()
        run: |
          mkdir -p shard-out/reports
          cp backend/target/surefire-reports/TEST-*.xml shard-out/reports/ 2>/dev/null || true
          cp backend/target/spring-contexts/contexts.txt shard-out/contexts.txt 2>/dev/null || true

      - name: Upload the shard reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-reports-${{ matrix.shard }}
          path: shard-out
          retention-days: 7
          if-no-files-found: ignore

  mutation:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && needs.changes.outputs.mutation == 'true' && needs.changes.outputs.reuse_mutation != 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      - name: Mark the job start
        run: echo "PIT_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21

      - name: Restore the Maven repository
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Restore the PIT incremental history
        id: pit-history
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: backend/target/pit-history
          key: pit-history-no-exact-match
          restore-keys: |
            pit-history-pr-${{ github.event.number }}-
            pit-history-${{ github.base_ref }}-

      - name: Run PIT with the 90 percent threshold
        working-directory: backend
        run: |
          set -o pipefail
          mkdir -p target/pit-history
          ./mvnw -B -P mutation test-compile org.pitest:pitest-maven:mutationCoverage 2>&1 | tee "$RUNNER_TEMP/pit.log"

      - name: Save the PIT incremental history
        if: (success() || failure()) && hashFiles('backend/target/pit-history/history.bin') != ''
        uses: actions/cache/save@v4
        with:
          path: backend/target/pit-history
          key: pit-history-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarize the PIT run
        if: always()
        shell: bash
        run: |
          {
            echo "### PIT mutation testing"
            echo "- Duration: $(( $(date +%s) - PIT_START ))s"
            echo "- Incremental history restored: ${{ steps.pit-history.outputs.cache-matched-key != '' }} (${{ steps.pit-history.outputs.cache-matched-key }})"
            grep -hE "Incremental analysis reduced|Created [0-9]+ mutation test units$|Generated [0-9]+ mutations|Calculated coverage|Will (read|write) history|run mutation analysis" "$RUNNER_TEMP/pit.log" | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: backend/target/pit-reports
          retention-days: 14
          if-no-files-found: ignore

  test-report:
    runs-on: ubuntu-latest
    needs: [changes, backend-tests]
    if: always() && needs.changes.outputs.relevant == 'true' && (needs.backend-tests.result != 'skipped' || needs.changes.outputs.reuse_backend == 'true')
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test of the budget scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Download the shard reports
        if: needs.changes.outputs.reuse_backend != 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: shard-reports-*
          path: shards

      - name: Inherit the shard reports of the pull request that already verified this tree
        if: needs.changes.outputs.reuse_backend == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ needs.changes.outputs.reuse_run }}
        run: gh run download "$REUSE_RUN" --repo "${{ github.repository }}" -p 'shard-reports-*' -D shards

      - name: Summarize what the reuse saved
        if: needs.changes.outputs.reuse_backend == 'true' && hashFiles('shards/**/meta.json') != ''
        env:
          REUSE_PR: ${{ needs.changes.outputs.reuse_pr }}
          REUSE_RUN: ${{ needs.changes.outputs.reuse_run }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          metas = [json.load(open(p)) for p in glob.glob('shards/*/meta.json')]
          clock = sum(max(m.get('end', 0) - m.get('start', 0), 0) for m in metas)
          print('### Reused from PR #%s (run %s)' % (os.environ['REUSE_PR'], os.environ['REUSE_RUN']))
          print('- Shards not executed: %d' % len(metas))
          print('- Compute saved: about %.1f minutes of runner time' % (clock / 60.0))
          PY

      - name: Download the integration-branch baseline
        if: needs.changes.outputs.baseline_run != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ needs.changes.outputs.baseline_run }}" --repo "${{ github.repository }}" -n test-baseline -D baseline

      - name: Build the report and enforce the Spring context cap
        id: report
        if: hashFiles('shards/**/meta.json') != ''
        shell: bash
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD > changed.txt || true
          fi
          args=(aggregate --shards shards --out report-out)
          [ -f baseline/metrics.json ] && args+=(--baseline baseline/metrics.json)
          [ -f changed.txt ] && args+=(--changed changed.txt)
          python3 .github/scripts/test-budget.py "${args[@]}"
          status=$?
          [ -f report-out/report.md ] && cat report-out/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Comment the report on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('report-out/report.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          repo="${{ github.repository }}"
          number="${{ github.event.pull_request.number }}"
          existing=$(gh api "repos/$repo/issues/$number/comments" --paginate --jq '.[] | select(.body | contains("<!-- test-time-report -->")) | .id' | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$repo/issues/comments/$existing" -F body=@report-out/report.md > /dev/null
          else
            gh api --method POST "repos/$repo/issues/$number/comments" -F body=@report-out/report.md > /dev/null
          fi

      - name: Add this run to the timing history
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && (needs.backend-tests.result == 'success' || needs.changes.outputs.reuse_backend == 'true') && hashFiles('report-out/metrics.json') != ''
        run: |
          mkdir -p baseline-out
          python3 .github/scripts/test-shards.py accumulate shards --history baseline --out baseline-out
          cp report-out/metrics.json baseline-out/metrics.json

      - name: Publish the timings as the baseline for pull requests
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && (needs.backend-tests.result == 'success' || needs.changes.outputs.reuse_backend == 'true') && hashFiles('baseline-out/metrics.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-baseline
          path: baseline-out
          retention-days: 60

      - name: Fail when the Spring context cap is exceeded
        if: steps.report.outputs.status != '' && steps.report.outputs.status != '0' && needs.changes.outputs.reuse_backend != 'true'
        run: exit 1

  backend:
    runs-on: ubuntu-latest
    needs: [changes, backend-tests, backend-contract, test-report, mutation]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Aggregate the backend results
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          TESTS: ${{ needs.backend-tests.result }}
          CONTRACT: ${{ needs.backend-contract.result }}
          REPORT: ${{ needs.test-report.result }}
          MUTATION: ${{ needs.mutation.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          REUSE: ${{ needs.changes.outputs.reuse_backend }}
          REUSE_PR: ${{ needs.changes.outputs.reuse_pr }}
          REUSE_RUN: ${{ needs.changes.outputs.reuse_run }}
        run: |
          set -uo pipefail
          echo "changes=$CHANGES tests=$TESTS contract=$CONTRACT report=$REPORT mutation=$MUTATION"
          if [ "$CHANGES" != "success" ]; then exit 1; fi
          if [ "$RELEVANT" != "true" ]; then
            echo "no backend changes"
            exit 0
          fi
          if [ "$REUSE" = "true" ]; then
            echo "Backend tests reused from PR #$REUSE_PR (run $REUSE_RUN): the merged tree is identical to the tree that PR verified." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$TESTS" = "success" ] && [ "$REPORT" = "success" ] && { [ "$CONTRACT" = "success" ] || [ "$CONTRACT" = "skipped" ]; } && { [ "$MUTATION" = "success" ] || [ "$MUTATION" = "skipped" ]; }

  frontend-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.reuse_frontend != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: frontend-tests (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Run the frontend test shard
        working-directory: frontend
        run: npm run test -- --shard=${{ matrix.shard }}/2

  frontend-checks:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && needs.changes.outputs.reuse_frontend != 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Audit production dependencies
        if: needs.changes.outputs.lockfile == 'true'
        working-directory: frontend
        run: npm run audit:prod

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  frontend:
    runs-on: ubuntu-latest
    needs: [changes, frontend-checks, frontend-tests]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    steps:
      - name: Aggregate the frontend results
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.frontend-checks.result }}
          TESTS: ${{ needs.frontend-tests.result }}
          RELEVANT: ${{ needs.changes.outputs.frontend }}
          REUSE: ${{ needs.changes.outputs.reuse_frontend }}
          REUSE_PR: ${{ needs.changes.outputs.reuse_pr }}
          REUSE_RUN: ${{ needs.changes.outputs.reuse_run }}
        run: |
          set -uo pipefail
          echo "changes=$CHANGES frontend=$RELEVANT reuse=$REUSE checks=$CHECKS tests=$TESTS"
          if [ "$CHANGES" != "success" ]; then exit 1; fi
          if [ "$RELEVANT" != "true" ]; then
            echo "no frontend changes"
            exit 0
          fi
          if [ "$REUSE" = "true" ]; then
            echo "Frontend reused from PR #$REUSE_PR (run $REUSE_RUN): the merged tree is identical to the tree that PR verified." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$CHECKS" = "success" ] && [ "$TESTS" = "success" ]

  # Nota: qa/bruno/ es la colección de exploración MANUAL (GUI/CLI local, contra
  # docker-compose.qa.yml — Postgres descartable, ver ese archivo). No corre en CI a
  # propósito: correrla acá además de Karate sería pagar el mismo costo dos veces
  # (levantar el backend real completo) por la misma cobertura. La regresión
  # automática de contrato HTTP vive en Karate, dentro del job `backend` de arriba
  # (KarateSuiteTest, @SpringBootTest RANDOM_PORT + el mismo Testcontainers que ya
  # usa el resto de la suite) — ver docs/context/testing.md.
