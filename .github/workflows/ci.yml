name: CI

on:
  push:
    branches: [develop, master]
    paths-ignore: ['*.md', 'docs/context/**', 'docs/*.png']
  pull_request:
    branches: [develop, master]
    paths-ignore: ['*.md', 'docs/context/**', 'docs/*.png']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend test suite
        working-directory: backend
        run: ./mvnw clean verify

  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: changes
        shell: bash
        run: |
          set -uo pipefail
          backend=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" 2>/dev/null); then
              if ! printf '%s\n' "$changed" | grep -q '^backend/'; then
                backend=false
              fi
            fi
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "backend changes: $backend"

      - name: Set up JDK 21
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run mutation testing
        if: steps.changes.outputs.backend == 'true'
        working-directory: backend
        run: ./mvnw -P mutation test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Upload PIT report
        if: always() && steps.changes.outputs.backend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: backend/target/pit-reports
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run frontend test suite
        working-directory: frontend
        run: npm run test

  # Nota: qa/bruno/ es la colección de exploración MANUAL (GUI/CLI local, contra
  # docker-compose.qa.yml — Postgres descartable, ver ese archivo). No corre en CI a
  # propósito: correrla acá además de Karate sería pagar el mismo costo dos veces
  # (levantar el backend real completo) por la misma cobertura. La regresión
  # automática de contrato HTTP vive en Karate, dentro del job `backend` de arriba
  # (KarateSuiteTest, @SpringBootTest RANDOM_PORT + el mismo Testcontainers que ya
  # usa el resto de la suite) — ver docs/context/testing.md.
