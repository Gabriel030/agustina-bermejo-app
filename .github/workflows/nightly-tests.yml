name: Nightly tests

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Regenerate the visual baselines and upload them as an artifact
        type: boolean
        default: false

concurrency:
  group: nightly-tests
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Decide whether develop changed since the last green nightly run
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          sha=$(gh api "repos/${{ github.repository }}/commits/develop" --jq .sha)
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if runs=$(gh run list --repo "${{ github.repository }}" --workflow nightly-tests.yml --status success --limit 10 --json databaseId --jq '.[].databaseId'); then
              for candidate in $runs; do
                rm -rf "$RUNNER_TEMP/verified"
                if gh run download "$candidate" --repo "${{ github.repository }}" -n nightly-tests-verified -D "$RUNNER_TEMP/verified" > /dev/null 2>&1; then
                  if [ "$(cat "$RUNNER_TEMP/verified/sha" 2>/dev/null)" = "$sha" ]; then
                    run=false
                  fi
                  break
                fi
              done
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "develop is at $sha: nightly run needed = $run"

  nightly-tests:
    runs-on: ubuntu-latest
    needs: decide
    if: needs.decide.outputs.run == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    name: nightly-tests (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - name: Pull the Postgres image in the background
        run: nohup docker pull -q postgres:16-alpine > "$RUNNER_TEMP/prepull.log" 2>&1 &

      - name: Verify the shard assignment covers every test class once
        run: python3 .github/scripts/test-shards.py verify 8

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21

      - name: Restore the Maven repository
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Run the shard with the nightly tier, migration and docs included
        working-directory: backend
        run: ./mvnw -B test "-Dtest=$(python3 ../.github/scripts/test-shards.py select ${{ matrix.shard }} 8)" -Dsurefire.failIfNoSpecifiedTests=false -Darchunit.freeze.store.default.allowStoreUpdate=false -Dtest.exploration=nightly -Dtest.excludedGroups=none

      - name: Collect the shard reports
        if: always()
        run: |
          mkdir -p shard-out/reports
          cp backend/target/surefire-reports/TEST-*.xml shard-out/reports/ 2>/dev/null || true

      - name: Upload the shard reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-reports-${{ matrix.shard }}
          path: shard-out
          retention-days: 7
          if-no-files-found: ignore

  demo-seed:
    runs-on: ubuntu-latest
    needs: decide
    if: needs.decide.outputs.run == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - name: Pull the Postgres image in the background
        run: nohup docker pull -q postgres:16-alpine > "$RUNNER_TEMP/prepull.log" 2>&1 &

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21

      - name: Restore the Maven repository
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Seed the demo with the ci dataset, the educational seed and the full dataset
        working-directory: backend
        run: ./mvnw -B test -Dtest=DemoSeedIT,DemoEducationalSeedIT,DemoFullSeedIT -Dsurefire.failIfNoSpecifiedTests=false -Darchunit.freeze.store.default.allowStoreUpdate=false -Dtest.exploration=nightly -Dtest.excludedGroups=none

      - name: Verify the seed tests ran and were not skipped
        if: always()
        run: python3 .github/scripts/verify-tests-ran.py backend/target/surefire-reports DemoSeedIT DemoEducationalSeedIT DemoFullSeedIT

  pwa-offline-e2e:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --user root
    needs: decide
    if: needs.decide.outputs.run == 'true'
    timeout-minutes: 20
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - name: Install the frontend and e2e dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Run the offline matrix against the production build
        working-directory: e2e
        run: npm run test:offline
        env:
          CI: "true"

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pwa-offline-e2e-report
          path: e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  visual-regression:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --user root
    needs: decide
    if: needs.decide.outputs.run == 'true'
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HOME: /root
    steps:
      - name: Refuse to update baselines on a protected branch
        if: inputs.update_baselines == true
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            develop|master|release/*|hotfix/*)
              echo "update_baselines is not allowed on $REF_NAME"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || needs.decide.outputs.sha }}

      - name: Install the frontend and e2e dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Compare the screenshots against the baselines
        if: inputs.update_baselines != true
        working-directory: e2e
        run: npm run test:visual
        env:
          CI: "true"

      - name: Regenerate the baselines
        if: inputs.update_baselines == true
        working-directory: e2e
        run: npm run test:visual:update
        env:
          CI: "true"

      - name: Commit the regenerated baselines to the dispatched branch
        if: inputs.update_baselines == true
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- e2e/specs/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "baselines unchanged"
            exit 0
          fi
          if git diff --cached --name-only | grep -v '^e2e/specs/visual/__screenshots__/'; then
            echo "unexpected files staged"
            exit 1
          fi
          git commit -m "test(e2e): baselines visuales regeneradas en el contenedor de Playwright"
          git push origin "HEAD:refs/heads/$REF_NAME"

      - name: Upload the regenerated baselines
        if: inputs.update_baselines == true
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: e2e/specs/visual/__screenshots__
          retention-days: 7

      - name: Upload the visual report and the diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  record:
    runs-on: ubuntu-latest
    needs: [decide, nightly-tests, demo-seed, pwa-offline-e2e, visual-regression]
    if: needs.decide.outputs.run == 'true' && needs.nightly-tests.result == 'success' && needs.demo-seed.result == 'success' && needs.pwa-offline-e2e.result == 'success' && needs.visual-regression.result == 'success'
    steps:
      - name: Record the verified develop commit
        run: |
          mkdir -p verified
          echo "${{ needs.decide.outputs.sha }}" > verified/sha

      - name: Upload the verified develop commit
        uses: actions/upload-artifact@v7
        with:
          name: nightly-tests-verified
          path: verified
          retention-days: 30
