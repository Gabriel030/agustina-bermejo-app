name: Nightly tests

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-tests
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Decide whether develop changed since the last green nightly run
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          sha=$(gh api "repos/${{ github.repository }}/commits/develop" --jq .sha)
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if runs=$(gh run list --repo "${{ github.repository }}" --workflow nightly-tests.yml --status success --limit 10 --json databaseId --jq '.[].databaseId'); then
              for candidate in $runs; do
                rm -rf "$RUNNER_TEMP/verified"
                if gh run download "$candidate" --repo "${{ github.repository }}" -n nightly-tests-verified -D "$RUNNER_TEMP/verified" > /dev/null 2>&1; then
                  if [ "$(cat "$RUNNER_TEMP/verified/sha" 2>/dev/null)" = "$sha" ]; then
                    run=false
                  fi
                  break
                fi
              done
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "develop is at $sha: nightly run needed = $run"

  nightly-tests:
    runs-on: ubuntu-latest
    needs: decide
    if: needs.decide.outputs.run == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    name: nightly-tests (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.sha }}

      - name: Pull the Postgres image in the background
        run: nohup docker pull -q postgres:16-alpine > "$RUNNER_TEMP/prepull.log" 2>&1 &

      - name: Verify the shard assignment covers every test class once
        run: python3 .github/scripts/test-shards.py verify 6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21

      - name: Restore the Maven repository
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Run the shard with the nightly tier, migration, Karate and docs included
        working-directory: backend
        run: ./mvnw -B test "-Dtest=$(python3 ../.github/scripts/test-shards.py select ${{ matrix.shard }} 6)" -Dsurefire.failIfNoSpecifiedTests=false -Darchunit.freeze.store.default.allowStoreUpdate=false -Dtest.exploration=nightly -Dtest.excludedGroups=none

      - name: Collect the shard reports
        if: always()
        run: |
          mkdir -p shard-out/reports
          cp backend/target/surefire-reports/TEST-*.xml shard-out/reports/ 2>/dev/null || true

      - name: Upload the shard reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports-${{ matrix.shard }}
          path: shard-out
          retention-days: 7
          if-no-files-found: ignore

  record:
    runs-on: ubuntu-latest
    needs: [decide, nightly-tests]
    if: needs.decide.outputs.run == 'true' && needs.nightly-tests.result == 'success'
    steps:
      - name: Record the verified develop commit
        run: |
          mkdir -p verified
          echo "${{ needs.decide.outputs.sha }}" > verified/sha

      - name: Upload the verified develop commit
        uses: actions/upload-artifact@v4
        with:
          name: nightly-tests-verified
          path: verified
          retention-days: 30
