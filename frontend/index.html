<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' __API_ORIGIN__ https://api.mercadopago.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Agustina B." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Agustina Bermejo</title>
    <script>
      // Evita el flash de tema equivocado: fija data-theme antes de que se
      // cargue el CSS, en vez de esperar a que ThemeProvider monte (ver
      // src/context/ThemeContext.jsx, misma fuente de verdad: localStorage
      // primero, preferencia de sistema si no hay nada guardado).
      (function () {
        var guardado = localStorage.getItem('tema');
        var tema =
          guardado === 'light' || guardado === 'dark'
            ? guardado
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = tema;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
