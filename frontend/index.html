<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <title>Agustina Bermejo</title>
    <script>
      // Evita el flash de tema equivocado: fija data-theme antes de que se
      // cargue el CSS, en vez de esperar a que ThemeProvider monte (ver
      // src/context/ThemeContext.jsx, misma fuente de verdad: localStorage
      // primero, preferencia de sistema si no hay nada guardado).
      (function () {
        var guardado = localStorage.getItem('tema');
        var tema =
          guardado === 'light' || guardado === 'dark'
            ? guardado
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.dataset.theme = tema;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
