name: ${COMPOSE_PROJECT_NAME:-agustina-bermejo}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agustina_bermejo}
      POSTGRES_USER: ${POSTGRES_USER:-agustina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-1g}
          cpus: "${POSTGRES_CPU_LIMIT:-1.5}"

  backend:
    build:
      context: ./backend
    image: ${BACKEND_IMAGE:-agustina-bermejo-backend:${APP_VERSION:-local}}
    restart: unless-stopped
    env_file:
      - path: ${ENV_FILE:-deploy/.env}
        required: true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agustina_bermejo}
      DB_USERNAME: ${POSTGRES_USER:-agustina}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      FORWARD_HEADERS_STRATEGY: native
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    volumes:
      - app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
      - default
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-1g}
          cpus: "${BACKEND_CPU_LIMIT:-1.5}"

  caddy:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_DEFAULT_DESIGN: ${VITE_DEFAULT_DESIGN:-}
        APP_VERSION: ${APP_VERSION:-}
    image: ${FRONTEND_IMAGE:-agustina-bermejo-frontend:${APP_VERSION:-local}}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-127.0.0.1/32}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - default
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT:-256m}
          cpus: "${CADDY_CPU_LIMIT:-0.5}"

networks:
  internal:
    internal: true

volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:
