title = "agustina-bermejo-app"

[extend]
useDefault = true

[allowlist]
description = "Contrasena de las cuentas demo y fixtures de test con valores ficticios; los secretos reales no viven ahi"
regexes = ['''Test1234''']
paths = [
  '''(^|/)backend/src/test/''',
  '''(^|/)frontend/src/.*\.test\.jsx?$''',
  '''(^|/)perf/README\.md$''',
  '''(^|/)deploy/\.env\.example$''',
  '''(^|/)target/''',
  '''(^|/)node_modules/''',
]
